# 이름공간(Namespace)은 클러스터 안을 논리적으로 나누는 칸막이입니다.
# 이 학습에서는 실습용 오브젝트를 default 와 섞지 않기 위해 씁니다.
#
# 이름공간에 속하는 리소스와 속하지 않는 리소스가 구분되어 있습니다.
# 확인: kubectl api-resources --namespaced=false
apiVersion: v1
kind: Namespace
metadata:
  name: learn
  labels:
    # 레이블은 나중에 셀렉터로 골라내기 위한 표식입니다. 04단계에서 이 개념이
    # Service 와 Pod 을 잇는 핵심이 됩니다.
    purpose: learning
