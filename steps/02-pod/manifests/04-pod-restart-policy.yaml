# restartPolicy 는 Pod 수준 설정이며 세 가지입니다.
#
#   Always     (기본값) 컨테이너가 끝나면 성공이든 실패든 다시 시작한다
#   OnFailure  0 이 아닌 종료 코드일 때만 다시 시작한다
#   Never      다시 시작하지 않는다
#
# 재시작하는 주체는 그 노드의 kubelet 이고, 같은 노드에서 다시 시작합니다.
# 노드 자체가 죽으면 아무도 살려 주지 않습니다. 이 한계가 컨트롤러(03단계)가 필요한 이유입니다.
apiVersion: v1
kind: Pod
metadata:
  name: once-never
  namespace: learn
  labels:
    demo: restart
spec:
  restartPolicy: Never
  containers:
    - name: job
      image: busybox:1
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "할 일을 하고 성공으로 끝납니다"
          sleep 3
          exit 0
---
apiVersion: v1
kind: Pod
metadata:
  name: once-onfailure
  namespace: learn
  labels:
    demo: restart
spec:
  restartPolicy: OnFailure
  containers:
    - name: job
      image: busybox:1
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "실패로 끝납니다. kubelet 이 다시 시작할 것입니다"
          sleep 3
          exit 1
      # 재시작이 반복되면 kubelet 은 간격을 점점 늘립니다(10초 -> 20초 -> 40초 ...
      # 최대 5분). 그 대기 상태의 이름이 CrashLoopBackOff 입니다.
      # RESTARTS 값이 올라가는 것을 kubectl get pods -w 로 지켜보십시오.
