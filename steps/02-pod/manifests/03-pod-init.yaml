# 초기화 컨테이너는 주 컨테이너보다 먼저, 끝까지 실행됩니다.
# 하나라도 실패하면 주 컨테이너는 시작하지 않습니다.
#
# 흔한 용도
#   - 의존 서비스(데이터베이스 등)가 응답할 때까지 기다린다
#   - 설정 파일이나 스키마를 미리 준비해 둔다
#   - 권한을 정리한다
apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  namespace: learn
  labels:
    app: init-demo
spec:
  volumes:
    - name: work
      emptyDir: {}

  initContainers:
    - name: prepare
      image: busybox:1
      volumeMounts:
        - name: work
          mountPath: /work
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "준비 작업을 시작합니다"
          sleep 5      # 초기화 단계를 눈으로 볼 수 있게 일부러 늦춥니다
          echo "초기화 컨테이너가 만든 파일입니다. 시각: $(date -Iseconds)" > /work/prepared.txt
          echo "준비 작업을 마쳤습니다"

  containers:
    - name: main
      image: busybox:1
      volumeMounts:
        - name: work
          mountPath: /work
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "주 컨테이너가 시작되었습니다. 준비된 파일을 읽습니다:"
          cat /work/prepared.txt
          # 컨테이너를 살려 두어야 Pod 이 Running 으로 남습니다.
          # 전경 프로세스가 끝나면 컨테이너도 끝납니다.
          sleep 3600
