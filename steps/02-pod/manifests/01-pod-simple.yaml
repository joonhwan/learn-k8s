# 가장 단순한 Pod. 컨테이너 하나만 있습니다.
#
# 실무에서는 이렇게 Pod 을 직접 만들지 않습니다. 여기서 손으로 만드는 이유는
# 03단계의 컨트롤러가 무엇을 대신해 주는지 알기 위함입니다.
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: learn
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        # 이 선언은 문서 역할에 가깝습니다. 적지 않아도 Pod IP 로 접속됩니다.
        # 확인해 보고 싶으면 이 줄들을 지우고 다시 적용한 뒤 port-forward 를 해 보십시오.
        - containerPort: 80
          name: http
