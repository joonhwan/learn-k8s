# 한 Pod 에 두 컨테이너를 두어, 무엇이 공유되는지 확인합니다.
#
#  - writer: 공유 볼륨에 계속 기록하고, 같은 디렉터리를 8081 포트로 서빙합니다.
#  - reader: 같은 볼륨을 읽습니다. 웹 서버가 없는데도 localhost:8081 에 접속됩니다.
#
# 확인할 것 두 가지
#   1. 파일시스템 공유:  두 컨테이너가 같은 /shared 를 봅니다.
#   2. 네트워크 공유:    reader 의 localhost 가 writer 의 포트로 연결됩니다.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  namespace: learn
  labels:
    app: sidecar-demo
spec:
  volumes:
    # emptyDir 은 Pod 이 살아 있는 동안만 존재하는 임시 공간입니다.
    # Pod 이 사라지면 내용도 사라집니다. 영속 저장은 07단계에서 다룹니다.
    - name: shared
      emptyDir: {}

  containers:
    - name: writer
      image: busybox:1
      volumeMounts:
        - name: shared
          mountPath: /shared
      command: ["/bin/sh", "-c"]
      args:
        - |
          # httpd 가 기본으로 찾는 문서를 먼저 만들어 둡니다.
          echo "writer 가 8081 포트에서 이 문서를 서빙합니다" > /shared/index.html
          # 배경에서 계속 기록합니다.
          ( while true; do
              echo "$(date -Iseconds) writer 가 씀" >> /shared/log.txt
              sleep 3
            done ) &
          # 전경 프로세스로 웹 서버를 띄웁니다. 컨테이너는 전경 프로세스가 살아 있는
          # 동안 돌아갑니다.
          exec httpd -f -p 8081 -h /shared

    - name: reader
      image: busybox:1
      volumeMounts:
        - name: shared
          mountPath: /shared
      command: ["/bin/sh", "-c"]
      args:
        - |
          # writer 가 쓴 마지막 줄을 계속 읽어 자기 로그로 남깁니다.
          while true; do
            echo "reader 가 읽음: $(tail -n 1 /shared/log.txt 2>/dev/null || echo '아직 없음')"
            sleep 3
          done
